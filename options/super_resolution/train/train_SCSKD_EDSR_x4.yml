name: SCSKD_EDSR_x4
model_type: SCSKDModel
scale: 4
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 10

# dataset and data loader settings
datasets:
  train:
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt: /home/elicer/data/DIV2K_train_HR
    dataroot_lq: /home/elicer/data/DIV2K_train_LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

    gt_size: 192
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 32
    dataset_enlarge_ratio: 10
    prefetch_mode: ~

  # we use multiple validation datasets. The SR benchmark datasets can be download from: https://cv.snu.ac.kr/research/EDSR/benchmark.tar
  val:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /home/elicer/data/benchmark/Set5/HR
    dataroot_lq: /home/elicer/data/benchmark/Set5/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk


network_g:
  type: EDSR
  num_in_ch: 3
  num_out_ch: 3
  upscale: 4
  num_feat: 64
  num_block: 32
  img_range: 1.
  res_scale: 0.1
  rgb_mean: [0.4488, 0.4371, 0.4040]



# Teacher: ViT-based (SwinIR) - THIS IS THE KEY CHANGE
network_t:
  type: SwinIR
  upscale: 4
  in_chans: 3
  img_size: 48
  window_size: 8
  img_range: 1.                   # Note: Different from EDSR!
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'


# --------------------------------------------------------------------------
# Paths and KDs 
# --------------------------------------------------------------------------



path:
  pretrain_network_g: /pretrained/EDSR_x3.pth
  pretrain_network_t: /pretrained/001_classicalSR_DIV2K_s48w8_SwinIR-M_x4.pth
  param_key_t: 'params_ema'
  strict_load_g: false
  resume_state: ~


kd_head:
  student_mid_channels: 64      # must match student mid-channel
  teacher_token_dim: 180        # set to teacher stage/tap channel dim
  num_scales: 3
  router_topk: 8
  router_temp: 1.0
  router_downsample_keys: 2   # 1 (off), 2 (↓N by 4×), 4 (↓N by 16×)
  # 2 for EDSR, 4 for RCAN

  teacher_has_cls: true

distill:
  tap_pairing: "zip"


  #  Keep mid-to-late features, drop early body layers
  student_tap: ["conv_first", "body.4.conv", "body.6.conv", "body.8.conv", "upsample.0"]
  teacher_tap: ["conv_first", "layers.3.residual_group", "layers.5.residual_group", "conv_after_body", "upsample.0"]

    # New architecture-aware options
  target_feature_count: 5 
  # --------------------------------------------------------------------------
# Training settings 
# --------------------------------------------------------------------------

train:
  amp: true
  
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 1.0e-4            # BS16 @ 250K → 2e-4 works best
    betas: [0.9, 0.999]
    weight_decay: 0.0

  scheduler:
    type: MultiStepLR
    milestones: [100000, 200000]
    gamma: 0.1

  total_iter: 250000
  warmup_iter: -1  # no warm up
  # ========================================================================
  # Core SCSAKD losses - keeping only the essential components
  # ========================================================================
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0              # Primary reconstruction loss
    reduction: mean

  kd_opt:
    type: L1Loss  
    loss_weight: 0.1              # Basic knowledge distillation loss
    reduction: mean

  # ========================================================================
  # SCSAKD: Sliced Wasserstein Distance (feature alignment)
  # ========================================================================
  swd_chunk: 32
  swd_num_proj: 64 
  
  # Core SCSAKD loss weights
  lambda_rec: 1.0
  lambda_kd: 0.3      # Increase from 0.15
  lambda_swd: 0.2     # Reduce from 0.25

# --------------------------------------------------------------------------
# Validation
# --------------------------------------------------------------------------
val:
  val_freq: 5000.0  # Back to standard validation frequency
  save_img: false
  self_ensemble: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logger:
  print_freq: 100
  save_checkpoint_freq: 5000.0
  use_tb_logger: true
  wandb:
    project: ~

# --------------------------------------------------------------------------
# Distributed
# --------------------------------------------------------------------------
dist_params:
  backend: nccl
  port: 29500
  find_unused_parameters: true
